name: Ledgerly iOS

on:
  push:
    paths:
      - "Ledgerly/**"
      - ".github/workflows/ledgerly-ios.yml"
  pull_request:
    paths:
      - "Ledgerly/**"
      - ".github/workflows/ledgerly-ios.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Ledgerly
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          for rt in sorted(d, reverse=True):
              if 'iOS' in rt:
                  for dev in d[rt]:
                      if dev['name'].startswith('iPhone'):
                          print(dev['udid']); sys.exit()
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      - name: Build and test
        run: |
          set +e
          xcodebuild test \
            -project Ledgerly.xcodeproj \
            -scheme Ledgerly \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1
          status=$?
          grep -E "error:|Test Case .*(passed|failed)|Executed [0-9]+ test|\*\* (BUILD|TEST)" build.log
          exit $status

      - name: Show compiler errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -100 || true
